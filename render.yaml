# Render Blueprint: New > Blueprint > pick this repo.
# Free plan caveats (see README "Deploying"): the service sleeps after ~15 min
# idle, and its disk is wiped on every deploy or restart, so the SQLite
# database does not survive. Use a paid persistent disk for real use.
services:
  - type: web
    name: commit-doctor
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: TIMEZONE
        value: Asia/Manila
      - key: ADMIN_TOKEN          # random value generated by Render; copy it from the dashboard
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY # must be 64 hex chars; set it yourself
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
